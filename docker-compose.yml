services:
  postgres:
    image: postgres:16-alpine
    container_name: support_platform_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-customer_support}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-customer_support}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: support_platform_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-customer_support}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-${GEMINI_API_KEY}}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-${GOOGLE_API_KEY}}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-replace-this-with-a-secure-random-secret-key-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=60
      - CHROMA_DB_DIR=/app/.chroma
    volumes:
      - ./uploads:/app/uploads
      - chroma_data:/app/.chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: support_platform_worker
    restart: always
    command: python -m backend.src.workers.document_worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-customer_support}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-${GEMINI_API_KEY}}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-${GOOGLE_API_KEY}}
      - CHROMA_DB_DIR=/app/.chroma
    volumes:
      - ./uploads:/app/uploads
      - chroma_data:/app/.chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; pids=[p for p in os.listdir('/proc') if p.isdigit()]; sys.exit(0 if len(pids)>1 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: support_platform_frontend
    restart: always
    ports:
      - "3100:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  chroma_data:
