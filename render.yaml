# Render Blueprint Configuration (render.yaml)
# Production Architecture for AI Customer Support Platform / AI Research Copilot
version: "1"

databases:
  - name: ai-customer-support-db
    databaseName: customer_support_db
    user: customer_support_user
    region: oregon
    plan: free

services:
  - type: web
    name: ai-customer-support-backend
    env: python
    region: oregon
    plan: starter
    autoDeploy: true
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "alembic upgrade head && uvicorn backend.src.app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    disk:
      name: chroma-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL
        fromDatabase:
          name: ai-customer-support-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_LLM_MODEL
        value: gemini-2.5-pro
      - key: GEMINI_EMBEDDING_MODEL
        value: models/text-embedding-004
      - key: CHROMA_USE_HTTP_CLIENT
        value: "false"
      - key: CHROMA_PERSIST_DIRECTORY
        value: /var/data/chroma
      - key: UPLOAD_BASE_DIR
        value: /var/data/uploads
      - key: ALLOWED_ORIGINS
        value: "https://ai-customer-support-platform.vercel.app"
