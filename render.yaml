services:
  # FastAPI Backend Web Service
  - type: web
    name: ai-customer-support-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-support-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://*.vercel.app","http://localhost:3000","http://localhost:3100","http://localhost:5173"]'
    disk:
      name: support-platform-storage
      mountPath: /app/uploads
      sizeGB: 10

databases:
  - name: ai-support-db
    databaseName: support_platform
    user: support_user
    region: oregon
    plan: starter
